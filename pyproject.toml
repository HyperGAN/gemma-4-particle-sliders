[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-4-particle-sliders"
version = "0.1.0"
description = "Paired-context Particle Sliders for Gemma 4 software engineering agents"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "requests>=2.32", "safetensors>=0.7", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "peft==0.21.3"]
model = ["transformers==5.13.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
